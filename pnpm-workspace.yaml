packages:
  - "apps/cli"
  - "apps/agent"
  - "apps/portal"
  - "apps/editor"
  - "library"

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
trustLockfile: false
blockExoticSubdeps: true
engineStrict: true
nodeVersion: 22.23.2
pmOnFail: error
autoInstallPeers: false
strictPeerDependencies: true
verifyStoreIntegrity: true
strictStorePkgContentCheck: true
verifyDepsBeforeRun: error
strictDepBuilds: true
savePrefix: ""

allowBuilds:
  esbuild: true
  workerd: true

# Pin the patched URI resolver until Ajv's minimum dependency excludes 3.1.5.
overrides:
  'ajv>fast-uri': 3.1.6
  # Miniflare pins vulnerable Sharp; retain its API with the patched libheif build.
  'miniflare@5.20260820.0-alpha>sharp': 0.35.4
